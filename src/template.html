<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <h1>CheckIt App</h1>
      <p>Write, do it, check it.</p>
    </header>
    <nav>
      <div class="navAdd">
        <button command="show-modal" commandfor="addTaskDialog">
          Add a task +
        </button>
        <button command="show-modal" commandfor="addProjectDialog">
          Add a project +
        </button>
      </div>

      <div class="navProjects">
        <h2>Projects</h2>
        <div projects>
          <ul ul-projects></ul>
        </div>
      </div>
    </nav>

    <main>
      <h3 nameMain>Todos</h3>
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Due Date</th>
            <th>Priority</th>
            <th>State</th>
            <th>Edit</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>

    <dialog id="addProjectDialog">
      <form action="" formAddProject>
        <label for="projectValue"> Name: </label>
        <input
          id="projectValue"
          name="projectValue"
          type="text"
          placeholder="Name of your project"
          required
        />
        <button addProject type="submit">Add</button>
      </form>
      <button command="close" commandfor="addProjectDialog" close>X</button>
    </dialog>

    <dialog id="addTaskDialog">
      <form action="" formAddTask>
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required />

        <label for="description">Description</label>
        <input type="text" id="description" name="description" required />

        <label for="dueDate">Due Date</label>
        <input type="date" id="dueDate" name="dueDate" required />

        <label for="priority">Priority</label>
        <select name="priority" id="priority">
          <option value="high">High</option>
          <option value="high">Medium</option>
          <option value="high">Low</option>
        </select>

        <label for="project">Project</label>
        <select name="project" id="project">
          <option value="default">Default</option>
        </select>

        <button addTask type="submit">Add</button>
      </form>
      <button command="close" commandfor="addTaskDialog" close>X</button>
    </dialog>
  </body>
</html>
