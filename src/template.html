<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <h1>CheckIt App</h1>
      <p>Write, Do it, Check it.</p>
    </header>
    <nav>
      <div>
        <button command="show-modal" commandfor="projectDialog">
          Add a project +
        </button>
        <button command="show-modal" commandfor="taskDialog">
          Add a task +
        </button>
      </div>

      <div>
        <h2>Projects</h2>
        <div>
          <ul ul-projects></ul>
        </div>
      </div>
    </nav>

    <main>
      <h3>Todos</h3>
      <table>
        <thead>
          <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Due Date</th>
            <th>Priority</th>
            <th>State</th>
            <th>Edit</th>
            <th>Deleete</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </main>

    <dialog id="projectDialog">
      <form method="dialog" formAddProject>
        <label for="projectNameInput"> Name: </label>
        <input
          id="projectNameInput"
          name="projectNameInput"
          type="text"
          placeholder="Name of your project"
          required
        />
        <button addProject type="submit">Add</button>
      </form>
      <button command="close" commandfor="projectDialog" close>X</button>
    </dialog>

    <dialog id="taskDialog">
      <form method="dialog" formAddTask>
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required />

        <label for="description">Description</label>
        <input type="text" id="description" name="description" required />

        <label for="dueDate">Due Date</label>
        <input type="date" id="dueDate" name="dueDate" required />

        <label for="priority">Priority</label>
        <select name="priority" id="priority">
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>

        <label for="projectSelect">Project</label>
        <select name="project" id="projectSelect"></select>

        <button addTask type="submit">Add</button>
      </form>
      <!-- <button command="close" commandfor="taskDialog" close>X</button> -->
    </dialog>
  </body>
</html>
